name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: clippy (sync, webhooks; no default)
        run: cargo clippy --no-default-features --features sync,webhooks --all-targets -- -D warnings
      - name: clippy (webhooks only; no default)
        run: cargo clippy --no-default-features --features webhooks --all-targets -- -D warnings
      - name: clippy (sync, webhooks, v4; no default)
        run: cargo clippy --no-default-features --features sync,webhooks,api-v4 --all-targets -- -D warnings

  feature-matrix:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo check --no-default-features --features async,rustls --all-targets
      - run: cargo check --no-default-features --features sync,rustls --all-targets
      - run: cargo check --no-default-features --features async,native-tls --all-targets
      - run: cargo check --no-default-features --features sync,native-tls --all-targets
      - run: cargo check --no-default-features --features async,rustls,sensitive-diagnostics --all-targets
      - run: cargo check --no-default-features --features sync,rustls,sensitive-diagnostics --all-targets
      - run: cargo check --no-default-features --features axum --all-targets
      - run: cargo check --no-default-features --features actix --all-targets
      - run: cargo check --no-default-features --features async,rustls,api-v4 --all-targets
      - run: cargo check --no-default-features --features sync,rustls,api-v4 --all-targets
      - run: cargo check --no-default-features --features webhooks,api-v4 --all-targets
      - run: cargo check --all-features --all-targets

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo check --all-features --all-targets

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: test (all features)
        run: cargo test --all-features
      - name: test (default features)
        run: cargo test
      - name: test (sync, webhooks; no default)
        run: cargo test --no-default-features --features sync,webhooks
      - name: test (webhooks only; no default)
        run: cargo test --no-default-features --features webhooks
      - name: test (sync, webhooks, v4; no default)
        run: cargo test --no-default-features --features sync,webhooks,api-v4
      - name: test (webhooks, v4; no default)
        run: cargo test --no-default-features --features webhooks,api-v4

  v4-coverage:
    name: v4 operation coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - run: python3 -m unittest tools.tests.test_check_v4_operations
      - run: python3 tools/check_v4_operations.py

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo doc --all-features --no-deps
      - run: cargo doc --no-default-features --features webhooks --no-deps
